name: hf-sync

# needs a repo secret HF_TOKEN (write access to HassamGani/HandWritingBench)
on:
  push:
    branches: [main]
    paths: [results/**, models/**, hf/**, src/hwbench/tasks.py]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run python scripts/release_hf.py ${{ startsWith(github.ref, 'refs/tags/v') && '--tag' || '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
